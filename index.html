<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDA TCL 腳本產生器 — Synopsys Tools</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --bg2: #1a1d26;
      --bg3: #22263a;
      --border: #2e3250;
      --accent: #4f8ef7;
      --accent2: #7c5cbf;
      --green: #3ecf8e;
      --yellow: #f5a623;
      --red: #e74c3c;
      --orange: #e67e22;
      --cyan: #17c3b2;
      --text: #e8eaf0;
      --text2: #9099b5;
      --text3: #5f6785;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .header .subtitle {
      font-size: 12px;
      color: var(--text2);
    }

    /* ── Tool Tabs ── */
    .tool-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tool-tab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.18s;
    }
    .tool-tab:hover { border-color: var(--accent); color: var(--accent); }
    .tool-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .tool-tab[data-tool="PT"].active { background: var(--green); border-color: var(--green); }
    .tool-tab[data-tool="ICC2"].active { background: var(--accent2); border-color: var(--accent2); }
    .tool-tab[data-tool="VCS"].active { background: var(--orange); border-color: var(--orange); }
    .tool-tab[data-tool="Formality"].active { background: var(--cyan); border-color: var(--cyan); }
    .tool-tab[data-tool="SpyGlass"].active { background: var(--red); border-color: var(--red); }

    /* ── Main Layout ── */
    .main {
      display: grid;
      grid-template-columns: 280px 1fr 400px;
      gap: 0;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Left Panel: Paths ── */
    .left-panel {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .path-group { display: flex; flex-direction: column; gap: 8px; }
    .path-item label {
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 3px;
      display: block;
    }
    .path-item input, .path-item select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      font-family: 'Monaco', 'Menlo', monospace;
      transition: border-color 0.15s;
    }
    .path-item input:focus, .path-item select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .path-item input::placeholder { color: var(--text3); }

    .divider {
      height: 1px;
      background: var(--border);
    }

    .var-preview {
      background: var(--bg3);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      font-family: monospace;
      color: var(--text2);
      line-height: 1.7;
    }
    .var-preview .var-name { color: var(--yellow); }
    .var-preview .var-val { color: var(--green); }

    .add-custom-btn {
      width: 100%;
      padding: 7px;
      border-radius: 6px;
      border: 1.5px dashed var(--border);
      background: transparent;
      color: var(--text3);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .add-custom-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Center Panel: Commands ── */
    .center-panel {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cmd-section {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .cmd-section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--bg3);
      cursor: pointer;
      user-select: none;
    }
    .cmd-section-header .icon { font-size: 16px; }
    .cmd-section-header .label {
      font-size: 13px;
      font-weight: 700;
      flex: 1;
    }
    .cmd-section-header .toggle {
      color: var(--text3);
      font-size: 12px;
      transition: transform 0.2s;
    }
    .cmd-section.collapsed .toggle { transform: rotate(-90deg); }
    .cmd-section.collapsed .cmd-buttons { display: none; }

    .cmd-buttons {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cmd-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .cmd-btn:hover {
      border-color: var(--accent);
      background: rgba(79,142,247,0.05);
      transform: translateX(2px);
    }
    .cmd-btn.inserted {
      border-color: var(--green);
      background: rgba(62,207,142,0.05);
      animation: flash 0.4s ease;
    }
    @keyframes flash {
      0% { background: rgba(62,207,142,0.25); }
      100% { background: rgba(62,207,142,0.05); }
    }
    .cmd-btn .btn-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .cmd-btn .btn-content { flex: 1; }
    .cmd-btn .btn-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }
    .cmd-btn .btn-desc {
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .cmd-btn .btn-preview {
      font-size: 10px;
      font-family: 'Monaco', 'Menlo', monospace;
      color: var(--text3);
      background: var(--bg3);
      padding: 3px 6px;
      border-radius: 4px;
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cmd-btn.has-options .btn-options {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .cmd-btn .btn-options span {
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 10px;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.12s;
    }
    .cmd-btn .btn-options span:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(79,142,247,0.08);
    }
    .cmd-btn .btn-options span.selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    /* ── Right Panel: Script Output ── */
    .right-panel {
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .right-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
      flex-wrap: wrap;
    }
    .right-header span { font-size: 13px; font-weight: 700; flex: 1; }
    .right-header .line-count {
      font-size: 11px;
      color: var(--text3);
      font-family: monospace;
    }
    .action-btns { display: flex; gap: 6px; }
    .action-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .action-btn.primary:hover { opacity: 0.85; }
    .action-btn.danger { border-color: var(--red); color: var(--red); }
    .action-btn.danger:hover { background: rgba(231,76,60,0.1); }

    .script-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    #script-output {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      resize: none;
      white-space: pre;
    }
    .script-highlighted {
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      background: transparent !important;
    }

    .toolbar-bottom {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg3);
      align-items: center;
    }
    .toolbar-bottom .info {
      font-size: 11px;
      color: var(--text3);
      flex: 1;
    }

    /* ── Tooltip ── */
    .tip {
      position: fixed;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--text2);
      pointer-events: none;
      z-index: 999;
      max-width: 300px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tip.visible { opacity: 1; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
      .left-panel { max-height: 280px; }
      .right-panel { min-height: 300px; }
    }

    /* ── Empty State ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text3);
      font-size: 13px;
      text-align: center;
      padding: 32px;
    }
    .empty-state .icon { font-size: 40px; }

    /* ── Section Colors ── */
    .cmd-section[data-cat="read"] .cmd-section-header { border-left: 3px solid var(--accent); }
    .cmd-section[data-cat="lib"] .cmd-section-header { border-left: 3px solid var(--accent2); }
    .cmd-section[data-cat="constraint"] .cmd-section-header { border-left: 3px solid var(--yellow); }
    .cmd-section[data-cat="compile"] .cmd-section-header { border-left: 3px solid var(--green); }
    .cmd-section[data-cat="report"] .cmd-section-header { border-left: 3px solid var(--cyan); }
    .cmd-section[data-cat="output"] .cmd-section-header { border-left: 3px solid var(--orange); }
    .cmd-section[data-cat="env"] .cmd-section-header { border-left: 3px solid var(--red); }
    .cmd-section[data-cat="floorplan"] .cmd-section-header { border-left: 3px solid var(--accent2); }
    .cmd-section[data-cat="place"] .cmd-section-header { border-left: 3px solid var(--green); }
    .cmd-section[data-cat="route"] .cmd-section-header { border-left: 3px solid var(--orange); }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div>
    <h1>EDA TCL 腳本產生器</h1>
    <div class="subtitle">Synopsys Tools — 點選按鈕即可產生對應 TCL 指令</div>
  </div>
  <div class="tool-tabs" id="toolTabs">
    <button class="tool-tab active" data-tool="DC">Design Compiler</button>
    <button class="tool-tab" data-tool="PT">PrimeTime</button>
    <button class="tool-tab" data-tool="ICC2">IC Compiler II</button>
    <button class="tool-tab" data-tool="VCS">VCS Simulation</button>
    <button class="tool-tab" data-tool="Formality">Formality</button>
    <button class="tool-tab" data-tool="SpyGlass">SpyGlass</button>
  </div>
</div>

<!-- Main Layout -->
<div class="main">

  <!-- Left: Path Config -->
  <div class="left-panel" id="leftPanel">
    <div>
      <div class="panel-title">路徑設定</div>
      <div class="path-group" id="pathGroup">
        <!-- Dynamic paths per tool -->
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="panel-title">常用參數</div>
      <div class="path-group" id="paramGroup">
        <!-- Dynamic params per tool -->
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="panel-title">變數預覽</div>
      <div class="var-preview" id="varPreview"></div>
    </div>

    <button class="add-custom-btn" id="addHeaderBtn">+ 加入檔頭說明</button>
    <button class="add-custom-btn" id="addCommentBtn">+ 加入分隔線註解</button>
  </div>

  <!-- Center: Command Buttons -->
  <div class="center-panel" id="centerPanel">
    <!-- Dynamic per tool -->
  </div>

  <!-- Right: Script Output -->
  <div class="right-panel">
    <div class="right-header">
      <span>產生的 TCL 腳本</span>
      <span class="line-count" id="lineCount">0 行</span>
      <div class="action-btns">
        <button class="action-btn" id="copyBtn">複製</button>
        <button class="action-btn primary" id="downloadBtn">下載 .tcl</button>
        <button class="action-btn danger" id="clearBtn">清除</button>
      </div>
    </div>
    <div class="script-area">
      <textarea id="script-output" spellcheck="false" placeholder="← 點選左邊的指令按鈕來產生 TCL 腳本&#10;&#10;腳本將在此顯示，可直接複製或下載"></textarea>
    </div>
    <div class="toolbar-bottom">
      <span class="info" id="statusInfo">選擇工具並點選指令開始產生腳本</span>
      <button class="action-btn" id="undoBtn">復原最後</button>
      <button class="action-btn" id="editModeBtn">編輯模式</button>
    </div>
  </div>

</div>

<!-- Tooltip -->
<div class="tip" id="tooltip"></div>

<script>
// ──────────────────────────────────────────────
// Tool Definitions
// ──────────────────────────────────────────────
const TOOLS = {

  DC: {
    name: 'Design Compiler',
    paths: [
      { key: 'RTL_DIR',    label: 'RTL 目錄',         placeholder: '/proj/rtl/src' },
      { key: 'TECH_LIB',   label: '技術 Library (.db)', placeholder: '/lib/TECH/db/slow.db' },
      { key: 'MW_LIB',     label: 'Milkyway Library',  placeholder: '/lib/TECH/mw/sc_lib' },
      { key: 'SDC_FILE',   label: 'SDC 約束檔',        placeholder: '/proj/constraints/top.sdc' },
      { key: 'OUTPUT_DIR', label: '輸出目錄',           placeholder: '/proj/syn/outputs' },
      { key: 'REPORT_DIR', label: '報告目錄',           placeholder: '/proj/syn/reports' },
    ],
    params: [
      { key: 'TOP_MODULE', label: '頂層模組名稱',  placeholder: 'TOP' },
      { key: 'CLK_PORT',   label: '時鐘腳位',      placeholder: 'clk' },
      { key: 'CLK_PERIOD', label: '時鐘週期 (ns)', placeholder: '2.0' },
      { key: 'MAX_CORES',  label: '最大使用核心數', placeholder: '8' },
    ],
    sections: [
      {
        cat: 'env', icon: '⚙️', label: '環境設定',
        cmds: [
          {
            icon: '🔧', label: '設定多核心並行',
            desc: '設定 DC 使用多核心加速綜合',
            preview: 'set_host_options -max_cores $MAX_CORES',
            tcl: () => `set_host_options -max_cores ${p('MAX_CORES')}`
          },
          {
            icon: '📚', label: '設定 Target Library',
            desc: '指定綜合用的技術庫（關鍵：決定 cell 的速度/面積特性）',
            preview: 'set target_library {TECH_LIB}',
            tcl: () => `set target_library {${p('TECH_LIB')}}`
          },
          {
            icon: '🔗', label: '設定 Link Library',
            desc: '設定 link library（包含 * 表示已讀取的設計）',
            preview: 'set link_library {* TECH_LIB}',
            tcl: () => `set link_library {* ${p('TECH_LIB')}}`
          },
          {
            icon: '🗂️', label: '設定 Symbol Library',
            desc: '設定符號庫（用於圖形顯示，可選）',
            preview: 'set symbol_library {tech.sdb}',
            tcl: () => `set symbol_library {${p('TECH_LIB').replace('.db','.sdb') || 'tech.sdb'}}`
          },
        ]
      },
      {
        cat: 'read', icon: '📂', label: '讀取設計',
        cmds: [
          {
            icon: '📄', label: '讀取 Verilog RTL',
            desc: '讀取所有 .v 檔案到 DC',
            preview: 'read_file -format verilog [glob RTL_DIR/*.v]',
            tcl: () => `read_file -format verilog [glob ${p('RTL_DIR')}/*.v]`
          },
          {
            icon: '📄', label: '讀取 SystemVerilog RTL',
            desc: '讀取所有 .sv 檔案（含 SV 語法）',
            preview: 'analyze -format sverilog [glob RTL_DIR/*.sv]',
            tcl: () => `analyze -format sverilog -define {SYNTHESIS} [glob ${p('RTL_DIR')}/*.sv]\nelaborate ${p('TOP_MODULE')}`
          },
          {
            icon: '📄', label: '讀取 VHDL',
            desc: '讀取所有 .vhd 檔案',
            preview: 'read_file -format vhdl [glob RTL_DIR/*.vhd]',
            tcl: () => `read_file -format vhdl [glob ${p('RTL_DIR')}/*.vhd]`
          },
          {
            icon: '🏗️', label: 'Link 設計',
            desc: '連接所有模組與 library，解析階層關係',
            preview: 'link',
            tcl: () => `link`
          },
          {
            icon: '✅', label: 'Check 設計',
            desc: '檢查設計是否有語法或連接錯誤',
            preview: 'check_design',
            tcl: () => `check_design`
          },
          {
            icon: '🎯', label: '設定頂層模組',
            desc: '指定要綜合的頂層模組',
            preview: 'current_design TOP_MODULE',
            tcl: () => `current_design ${p('TOP_MODULE')}`
          },
          {
            icon: '💾', label: '讀取 DDC 設計',
            desc: '讀取已儲存的 DDC 格式設計',
            preview: 'read_file -format ddc design.ddc',
            tcl: () => `read_file -format ddc ${p('OUTPUT_DIR')}/design.ddc`
          },
        ]
      },
      {
        cat: 'constraint', icon: '⏱️', label: '設定時序約束',
        cmds: [
          {
            icon: '🕐', label: '建立時鐘',
            desc: '建立主時鐘，定義週期與波形',
            preview: 'create_clock -period CLK_PERIOD [get_ports CLK_PORT]',
            tcl: () => `create_clock -period ${p('CLK_PERIOD')} -name ${p('CLK_PORT')}_clk [get_ports ${p('CLK_PORT')}]`
          },
          {
            icon: '🕐', label: '建立衍生時鐘 (除2)',
            desc: '建立除頻衍生時鐘',
            preview: 'create_generated_clock -divide_by 2 ...',
            tcl: () => `create_generated_clock -name ${p('CLK_PORT')}_div2 \\
  -source [get_ports ${p('CLK_PORT')}] \\
  -divide_by 2 \\
  [get_pins u_clk_div/clk_out]`
          },
          {
            icon: '⬅️', label: '設定輸入延遲',
            desc: '設定所有輸入腳位的輸入延遲（除時鐘外）',
            preview: 'set_input_delay -max 0.5 -clock CLK [all_inputs]',
            tcl: () => `set_input_delay -max ${(parseFloat(p('CLK_PERIOD'))*0.25||0.5).toFixed(2)} -clock ${p('CLK_PORT')}_clk [remove_from_collection [all_inputs] [get_ports ${p('CLK_PORT')}]]`
          },
          {
            icon: '➡️', label: '設定輸出延遲',
            desc: '設定所有輸出腳位的輸出延遲',
            preview: 'set_output_delay -max 0.5 -clock CLK [all_outputs]',
            tcl: () => `set_output_delay -max ${(parseFloat(p('CLK_PERIOD'))*0.25||0.5).toFixed(2)} -clock ${p('CLK_PORT')}_clk [all_outputs]`
          },
          {
            icon: '🔄', label: '設定 False Path',
            desc: '宣告不需要時序分析的路徑（跨時鐘域/常數路徑）',
            preview: 'set_false_path -from [get_clocks clkA] -to [get_clocks clkB]',
            tcl: () => `# 請修改時鐘名稱\nset_false_path -from [get_clocks clkA] -to [get_clocks clkB]`
          },
          {
            icon: '⬛', label: '設定 Multicycle Path',

// ──────────────────────────────────────────────
// State
// ──────────────────────────────────────────────
let currentTool = 'DC';
let scriptLines = [];
let history = [];
const pathValues = {};
const paramValues = {};

// ──────────────────────────────────────────────
// Path Value Accessors
// ──────────────────────────────────────────────
function p(key) {
  return pathValues[key] || paramValues[key] || `\${${key}}`;
}

function getAllValues() {
  const tool = TOOLS[currentTool];
  const result = {};
  tool.paths.forEach(({ key }) => result[key] = pathValues[key] || `\${${key}}`);
  tool.params.forEach(({ key }) => result[key] = paramValues[key] || `\${${key}}`);
  return result;
}

// ──────────────────────────────────────────────
// Render Left Panel
// ──────────────────────────────────────────────
function renderLeftPanel() {
  const tool = TOOLS[currentTool];
  const pg = document.getElementById('pathGroup');
  const pm = document.getElementById('paramGroup');

  pg.innerHTML = tool.paths.map(({ key, label, placeholder }) => `
    <div class="path-item">
      <label>${label}</label>
      <input type="text" data-key="${key}" data-type="path"
             value="${pathValues[key] || ''}"
             placeholder="${placeholder}">
    </div>
  `).join('');

  pm.innerHTML = tool.params.map(({ key, label, placeholder }) => `
    <div class="path-item">
      <label>${label}</label>
      <input type="text" data-key="${key}" data-type="param"
             value="${paramValues[key] || ''}"
             placeholder="${placeholder}">
    </div>
  `).join('');

  // Bind change events
  document.querySelectorAll('.path-item input').forEach(input => {
    input.addEventListener('input', () => {
      if (input.dataset.type === 'path') pathValues[input.dataset.key] = input.value;
      else paramValues[input.dataset.key] = input.value;
      renderVarPreview();
    });
  });

  renderVarPreview();
}

function renderVarPreview() {
  const tool = TOOLS[currentTool];
  const lines = [];
  tool.paths.forEach(({ key, placeholder }) => {
    const val = pathValues[key] || '';
    lines.push(`<span class="var-name">${key}</span> = <span class="var-val">${val || `<${placeholder}>`}</span>`);
  });
  tool.params.forEach(({ key, placeholder }) => {
    const val = paramValues[key] || '';
    lines.push(`<span class="var-name">${key}</span> = <span class="var-val">${val || `<${placeholder}>`}</span>`);
  });
  document.getElementById('varPreview').innerHTML = lines.join('\n');
}

// ──────────────────────────────────────────────
// Render Center Panel
// ──────────────────────────────────────────────
function renderCenterPanel() {
  const tool = TOOLS[currentTool];
  const panel = document.getElementById('centerPanel');

  panel.innerHTML = tool.sections.map(section => `
    <div class="cmd-section" data-cat="${section.cat}">
      <div class="cmd-section-header" onclick="toggleSection(this.parentElement)">
        <span class="icon">${section.icon}</span>
        <span class="label">${section.label}</span>
        <span class="toggle">▼</span>
      </div>
      <div class="cmd-buttons">
        ${section.cmds.map((cmd, ci) => `
          <div class="cmd-btn" data-section="${section.cat}" data-idx="${ci}"
               onclick="insertCmd('${section.cat}', ${ci})"
               onmouseenter="showTooltip(event, this)"
               onmouseleave="hideTooltip()">
            <span class="btn-icon">${cmd.icon}</span>
            <div class="btn-content">
              <div class="btn-label">${cmd.label}</div>
              <div class="btn-desc">${cmd.desc}</div>
              <div class="btn-preview">${cmd.preview}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleSection(el) {
  el.classList.toggle('collapsed');
}

// ──────────────────────────────────────────────
// Insert Command
// ──────────────────────────────────────────────
function insertCmd(sectionCat, cmdIdx) {
  const tool = TOOLS[currentTool];
  const section = tool.sections.find(s => s.cat === sectionCat);
  const cmd = section.cmds[cmdIdx];

  // Save history
  history.push(document.getElementById('script-output').value);

  // Generate TCL
  const tcl = cmd.tcl();

  // Add to script
  const out = document.getElementById('script-output');
  const existing = out.value;
  const newContent = existing ? existing + '\n\n' + tcl : tcl;
  out.value = newContent;

  updateLineCount();
  updateStatus(`已插入：${cmd.label}`);

  // Visual feedback on button
  const btn = document.querySelector(`[data-section="${sectionCat}"][data-idx="${cmdIdx}"]`);
  if (btn) {
    btn.classList.add('inserted');
    setTimeout(() => btn.classList.remove('inserted'), 600);
  }

  // Scroll to bottom
  out.scrollTop = out.scrollHeight;
}

// ──────────────────────────────────────────────
// Script Actions
// ──────────────────────────────────────────────
function updateLineCount() {
  const out = document.getElementById('script-output');
  const lines = out.value ? out.value.split('\n').length : 0;
  document.getElementById('lineCount').textContent = `${lines} 行`;
}

function updateStatus(msg) {
  document.getElementById('statusInfo').textContent = msg;
}

document.getElementById('copyBtn').onclick = async () => {
  const text = document.getElementById('script-output').value;
  if (!text) { updateStatus('腳本為空'); return; }
  await navigator.clipboard.writeText(text);
  updateStatus('已複製到剪貼板 ✓');
};

document.getElementById('downloadBtn').onclick = () => {
  const text = document.getElementById('script-output').value;
  if (!text) { updateStatus('腳本為空'); return; }
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${currentTool.toLowerCase()}_script.tcl`;
  a.click();
  updateStatus(`已下載 ${currentTool.toLowerCase()}_script.tcl`);
};

document.getElementById('clearBtn').onclick = () => {
  const out = document.getElementById('script-output');
  if (!out.value) return;
  history.push(out.value);
  out.value = '';
  updateLineCount();
  updateStatus('腳本已清除');
};

document.getElementById('undoBtn').onclick = () => {
  if (history.length === 0) { updateStatus('沒有可復原的操作'); return; }
  document.getElementById('script-output').value = history.pop();
  updateLineCount();
  updateStatus('已復原');
};

document.getElementById('editModeBtn').onclick = () => {
  const out = document.getElementById('script-output');
  out.readOnly = !out.readOnly;
  document.getElementById('editModeBtn').textContent = out.readOnly ? '編輯模式' : '鎖定模式';
  updateStatus(out.readOnly ? '已鎖定（防止誤操作）' : '編輯模式已開啟');
};

document.getElementById('addHeaderBtn').onclick = () => {
  const tool = TOOLS[currentTool];
  const date = new Date().toISOString().slice(0, 10);
  const header = `##################################################
# ${tool.name} 腳本
# 產生日期：${date}
# 設計：${paramValues['TOP_MODULE'] || 'TOP_MODULE'}
# 工具：Synopsys ${currentTool}
##################################################\n`;
  const out = document.getElementById('script-output');
  history.push(out.value);
  out.value = header + (out.value ? '\n' + out.value : '');
  updateLineCount();
  updateStatus('已加入檔頭');
};

document.getElementById('addCommentBtn').onclick = () => {
  const out = document.getElementById('script-output');
  history.push(out.value);
  const sep = '\n# ──────────────────────────────────────────\n';
  out.value = out.value + sep;
  updateLineCount();
  updateStatus('已加入分隔線');
  out.scrollTop = out.scrollHeight;
};

// Live line count update
document.getElementById('script-output').addEventListener('input', updateLineCount);

// ──────────────────────────────────────────────
// Tooltip
// ──────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTooltip(e, el) {
  const sectionCat = el.dataset.section;
  const cmdIdx = parseInt(el.dataset.idx);
  const tool = TOOLS[currentTool];
  const section = tool.sections.find(s => s.cat === sectionCat);
  const cmd = section.cmds[cmdIdx];
  tooltip.innerHTML = `<b>${cmd.label}</b><br>${cmd.desc}`;
  tooltip.style.left = e.clientX + 12 + 'px';
  tooltip.style.top = e.clientY + 8 + 'px';
  tooltip.classList.add('visible');
}
function hideTooltip() {
  tooltip.classList.remove('visible');
}

// ──────────────────────────────────────────────
// Tool Switching
// ──────────────────────────────────────────────
document.getElementById('toolTabs').addEventListener('click', e => {
  const tab = e.target.closest('.tool-tab');
  if (!tab) return;
  document.querySelectorAll('.tool-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentTool = tab.dataset.tool;
  renderLeftPanel();
  renderCenterPanel();
  updateStatus(`已切換到 ${TOOLS[currentTool].name}`);
});

// ──────────────────────────────────────────────
// Init
// ──────────────────────────────────────────────
function init() {
  renderLeftPanel();
  renderCenterPanel();
  updateStatus('選擇工具並點選指令開始產生腳本');
}

init();
</script>
</body>
</html>
